kubernetes-dashboard:
  # Namespace where the dashboard will run
  namespace: kubernetes-dashboard
  
  # Enable or disable metrics-scraper (useful for pod/resource metrics)
  metricsScraper:
    enabled: true
  
  # Dashboard settings
  settings:
    clusterName: "HomeLab"
    itemsPerPage: 20
    logsAutoRefreshTimeInterval: 5
    resourceAutoRefreshTimeInterval: 5
  
  # Service configuration
  service:
    type: ClusterIP
    port: 443
  
   
  # RBAC: service account for login
  serviceAccount:
    create: true
    name: "kubernetes-dashboard"
